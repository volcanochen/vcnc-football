<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VCNC足球 · 集锦分享</title>
<style>
  :root { --ink:#111827; --sub:#6b7280; --line:#e5e7eb; --brand:#07c160; --blue:#00aeec; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 18px 40px; background:#f6f7f9; color:var(--ink);
         font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .card { max-width:460px; margin:0 auto; padding:22px 20px; background:#fff;
          border:1px solid var(--line); border-radius:14px; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .logo { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#00aeec,#0b7fb8);
          display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
  .brand b { font-size:16px; }
  .brand span { display:block; color:var(--sub); font-size:11px; font-weight:400; }
  h1 { margin:0 0 4px; font-size:19px; }
  .tip { margin:0 0 18px; color:var(--sub); font-size:13px; }
  .clip { padding:12px 14px; margin-bottom:14px; border:1px solid var(--line);
          border-left:3px solid var(--blue); border-radius:8px; background:#fafbfc; }
  .clip b { font-size:15px; }
  .clip .meta { color:var(--sub); font-size:12px; margin-top:3px; }
  .btn { display:block; width:100%; height:46px; margin:9px 0; border:none; border-radius:9px;
         color:#fff; background:var(--brand); font-size:15px; font-weight:600; cursor:pointer; }
  .btn.sec { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500; }
  .btn.blue { background:var(--blue); }
  .code { width:100%; height:64px; margin:8px 0; padding:8px; border:1px solid var(--line);
          border-radius:8px; font:11px/1.4 monospace; word-break:break-all; resize:none; color:var(--sub); }
  .hint { display:none; margin:12px 0 0; padding:10px 12px; border-radius:8px;
          background:#fff8e6; color:#8a5a00; font-size:13px; line-height:1.6; }
  .foot { margin-top:18px; text-align:center; color:var(--sub); font-size:12px; }
  .foot a { color:var(--blue); text-decoration:none; }
  .wx-slot { display:none; }
  .err { color:#b91c1c; font-size:13px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">⚽</div>
    <div><b>VCNC足球</b><span>自定义集锦分享</span></div>
  </div>

  <div id="ok">
    <h1 id="title">朋友分享了一段集锦</h1>
    <p class="tip">装了 VCNC足球就直接打开；没装也没关系，复制导入码发给自己，装好后在 App 里导入。</p>
    <div id="clips"></div>
    <button class="btn" id="openApp" type="button">打开 VCNC足球 并导入</button>
    <button class="btn sec" id="openBrowser" type="button">在浏览器里打开 App</button>
    <button class="btn sec" id="copy" type="button">复制导入码</button>
    <textarea class="code" id="code" readonly></textarea>
    <p class="hint" id="hint"></p>
  </div>

  <div id="bad" style="display:none">
    <h1>这个分享链接不完整</h1>
    <p class="tip err" id="errMsg">导入码缺失或已损坏，请让朋友重新分享一次，或直接把以 VC1. 开头的那串文本发给你。</p>
  </div>

  <!-- 可选：拿到微信开放平台移动应用 AppID 后，把 WX_APPID 填上并接入 wx.config，
       再把 .wx-slot 里的开放标签显示出来，即可在微信内一键唤起 App。
       extinfo 直接放 VC1.… 导入码，App 侧在 ShowMessageFromWX.Req.messageExt 里读。 -->
  <div class="wx-slot" id="wxSlot"></div>

  <div class="foot">
    没有 App？<a href="https://github.com/volcanochen/vcnc-football/releases/latest">下载最新版 VCNC足球</a>
  </div>
</div>

<script>
(function () {
  'use strict';
  var WX_APPID = '';                    // 有认证服务号 + 开放平台移动应用时填写
  var SHARE_DOWNLOAD = 'https://github.com/volcanochen/vcnc-football/releases/latest';
  var $ = function (id) { return document.getElementById(id); };

  function getCode() {
    var h = location.hash || '', q = location.search || '';
    var m = /[#?&]d=([^&]+)/.exec(h) || /[?&]d=([^&]+)/.exec(q);
    if (m) { try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; } }
    return '';
  }
  function b64d(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var raw = atob(s);
    try { return decodeURIComponent(escape(raw)); }
    catch (e) { return raw; }
  }
  function crc8(s) {
    var c = 0;
    for (var i = 0; i < s.length; i++) {
      c ^= s.charCodeAt(i) & 255;
      for (var b = 0; b < 8; b++) c = (c & 128) ? ((c << 1) ^ 7) & 255 : (c << 1) & 255;
    }
    return ('0' + (c & 255).toString(16)).slice(-2);
  }
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return h ? (h + ':' + p(m) + ':' + p(s)) : (m + ':' + p(s));
  }
  var whole = getCode();
  var m = /^VC1\.([A-Za-z0-9\-_]+)\.([0-9a-fA-F]{2})$/.exec(whole);
  var data = null;
  if (m && crc8(m[1]) === m[2].toLowerCase()) {
    try { data = JSON.parse(b64d(m[1])); } catch (e) {}
  }
  if (!data || data.v !== 1 || !data.c || !data.c.length) {
    $('ok').style.display = 'none'; $('bad').style.display = 'block';
    return;
  }
  $('code').value = whole;
  var box = $('clips'), max = Math.min(data.c.length, 6);
  $('title').textContent = data.c.length > 1
    ? ('朋友分享了 ' + data.c.length + ' 段集锦') : '朋友分享了一段集锦';
  for (var i = 0; i < max; i++) {
    var c = data.c[i], d = document.createElement('div');
    d.className = 'clip';
    var b = document.createElement('b'); b.textContent = c.n || '片段'; d.appendChild(b);
    var meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = fmt(c.s) + ' +' + c.d + 's · @' + (c.u || '朋友') + ' · ' + (data.b || '');
    d.appendChild(meta); box.appendChild(d);
  }
  if (data.c.length > max) {
    var more = document.createElement('div');
    more.className = 'meta'; more.textContent = '…另有 ' + (data.c.length - max) + ' 段，导入后可见';
    box.appendChild(more);
  }

  var bv = /^BV[0-9A-Za-z]{10}$/.test(data.b || '') ? data.b : '';
  var scheme = 'vcncfootball://import?b=' + encodeURIComponent(bv) + '&d=' + encodeURIComponent(whole);
  var intent = 'intent://import?b=' + encodeURIComponent(bv) + '&d=' + encodeURIComponent(whole) +
               '#Intent;scheme=vcncfootball;package=com.vcncfootball;S.browser_fallback_url=' +
               encodeURIComponent(SHARE_DOWNLOAD) + ';end';
  var left = false;

  function launched() { return document.hidden || left; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
  window.addEventListener('pagehide', function () { left = true; });
  function showHint(msg) { var h = $('hint'); h.textContent = msg; h.style.display = 'block'; }

  function tryOpen(url) {
    var t = Date.now();
    // 微信内置浏览器对自定义 scheme 普遍拦截：1.6s 后还在本页就明确给出降级路径
    setTimeout(function () {
      if (!launched() && Date.now() - t >= 1500) {
        showHint('微信里通常不能直接打开 App：请点右上角「···」→「在浏览器打开」，再点本页的打开按钮；或者直接复制下面的导入码，在 VCNC足球里点「导入集锦」。');
      }
    }, 1700);
    try { location.href = url; } catch (e) {}
    var f = document.createElement('iframe');
    f.style.display = 'none'; f.src = url;
    document.body.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 900);
  }
  $('openApp').addEventListener('click', function () { tryOpen(scheme); });
  $('openBrowser').addEventListener('click', function () { tryOpen(intent); });
  $('copy').addEventListener('click', function () {
    var ta = $('code');
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    if (!done && navigator.clipboard) {
      navigator.clipboard.writeText(whole).then(function () { showHint('导入码已复制，去 VCNC足球点「从剪贴板导入」即可。'); });
    } else {
      showHint(done ? '导入码已复制，去 VCNC足球点「从剪贴板导入」即可。' : '请长按上面的文本框手动复制导入码。');
    }
  });

  // 微信开放标签接入位：有 WX_APPID 且已完成 wx.config 时，把它显示出来
  if (WX_APPID) {
    var slot = $('wxSlot');
    slot.style.display = 'block';
    slot.setAttribute('extinfo', whole);
    /* <wx-open-launch-app id="launch-btn" appid="WX_APPID" extinfo="VC1.…">
         <template><button>在 App 中打开</button></template>
       </wx-open-launch-app> */
  }
})();
</script>
</body>
</html>
