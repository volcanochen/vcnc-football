<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VCNC足球沉浸场</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300aeec'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M16 4v5M16 23v5M4 16h5M23 16h5' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="feed.css">
</head>
<body data-page="1">

<div id="appWrap">
  <!-- 三页容器：0 比赛列表 / 1 播放 / 2 设置；只通过顶部标签切换 -->
  <div id="pager">

    <!-- ============ 第 0 页：播放列表（独立全屏页，纵向虚拟滚动） ============ -->
    <section class="page page-list" id="pageList">
      <div class="vlist" id="vlist">
        <div class="vlist-head">
          <span>选择比赛</span>
          <span class="vlist-count" id="vlistCount"></span>
          <button class="sheet-close" id="vlistClose" type="button" title="回到播放">▶</button>
        </div>
        <div class="vlist-body" id="vlistBody"><div class="vlist-canvas" id="vlistCanvas"></div></div>
        <div class="vlist-foot" id="vlistFoot" hidden><button class="vlist-more" id="vlistMore" type="button">加载更多…</button></div>
      </div>
    </section>

    <!-- ============ 第 1 页：播放 ============ -->
    <section class="page page-play" id="pagePlay">
      <!-- 视频流容器：每个 .clip 一场比赛，JS 动态创建/回收 -->
      <div id="feed"></div>

      <!-- 集锦浮窗：靠右窄条半透明，尽量不遮画面；标题=集锦/全场切换，行点击跳片段 -->
      <div id="segFloat" class="segfloat">
        <div class="sf-head">
          <button class="sf-title" id="sfTitle" type="button" title="点击切换 集锦连播 / 全场录像">集锦</button>
          <span class="sf-count" id="sfCount">—</span>
          <button class="sf-fold" id="sfFold" type="button" title="收起/展开">›</button>
        </div>
        <div class="sf-body" id="sfBody"></div>
      </div>

      <!-- 亮度遮罩：左半屏上下滑动调节 -->
      <div id="brightMask"></div>

      <!-- 左下角控制条：播放/暂停 + 倒放方向 + 慢动作三档 -->
      <div id="cornerCtl">
        <button class="cbtn" id="btnPlay" aria-label="播放/暂停"></button>
        <button class="cbtn rev" id="btnRev" type="button" title="切换播放方向：▶ 正放 / ◀ 倒放" aria-label="切换播放方向"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h12.5"/><path d="M13.5 4.5 17 8l-3.5 3.5"/><path d="M20 16H7.5"/><path d="M10.5 12.5 7 16l3.5 3.5"/></svg></button>
        <span class="csep"></span>
        <button class="cbtn loop" id="btnLoop" type="button" title="锁定当前片段循环播放" aria-label="单片段循环"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20.5 2.5V7H16"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></button>
        <span class="csep"></span>
        <button class="cbtn track" id="btnTrack" type="button" title="跟踪球：算法自动追着球/持球人放大取景" aria-label="跟踪球"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg></button>
        <span class="csep"></span>
        <button class="cbtn slow" data-rate="0.5">0.5×</button>
        <button class="cbtn slow" data-rate="0.25">0.25×</button>
        <button class="cbtn slow" data-rate="0.125">0.125×</button>
      </div>

      <!-- 滑动调节 OSD（亮度/音量） -->
      <div id="swipeOsd" hidden>
        <div class="osd-track"><div class="osd-fill"></div></div>
        <div class="osd-val"></div>
      </div>

      <!-- 用户自助调整过取景（双指缩放/平移）后出现的「恢复画面」浮动按钮 -->
      <button id="viewReset" type="button" hidden>恢复画面</button>

    </section>

    <!-- ============ 第 2 页：设置（独立全屏页，纵向可滚动） ============ -->
    <section class="page page-set" id="pageSet">
      <div class="sheet" id="sheet">
        <div class="set-row">
          <span class="lab">播放内容</span>
          <div class="seg" id="modeSeg">
            <button data-mode="hl" class="on">集锦连播</button>
            <button data-mode="full">原片</button>
          </div>
        </div>

        <div class="set-row">
          <span class="lab">画面填充</span>
          <div class="seg" id="fitSeg">
            <button data-fit="contain" class="on">完整</button>
            <button data-fit="cover">铺满</button>
          </div>
        </div>
        <div class="set-row">
          <span class="lab">默认画面</span>
          <button class="chip" id="resetViewBtn" type="button">恢复完整显示 + 全部集锦</button>
        </div>
        <div class="set-row">
          <span class="lab">集锦浮窗</span>
          <button class="sw" id="segFloatSw" role="switch"></button>
        </div>

        <!-- 集锦分类：目前按备注里的「字符」字面筛选；后续提供字符含义表后替换匹配规则 -->
        <div class="set-row">
          <span class="lab">集锦分类</span>
          <input id="catInput" class="cat-input" type="text" placeholder="输入字符，留空=全部" spellcheck="false" autocomplete="off">
          <button class="chip" id="catApply" type="button">筛选</button>
        </div>
        <div class="cat-panel">
          <div class="cat-tokens" id="catTokens"></div>
          <div class="cat-count" id="catCount">尚未载入比赛</div>
        </div>

        <!-- 时间戳前后补时：默认自动（配合时间码对齐），步进器手动调整即接管 -->
        <div class="set-row">
          <span class="lab">自动补时</span>
          <button class="sw on" id="padAutoSw" role="switch" aria-label="自动补时"></button>
        </div>
        <div class="set-row">
          <span class="lab">前置补时</span>
          <div class="stepper" id="padFrontStep">
            <button class="stp" type="button" data-step="-0.5" aria-label="减少前置补时">−</button>
            <span class="stp-val" id="padFrontVal">1.0s</span>
            <button class="stp" type="button" data-step="0.5" aria-label="增加前置补时">+</button>
          </div>
          <span class="step-unit">秒</span>
        </div>
        <div class="set-row">
          <span class="lab">后置补时</span>
          <div class="stepper" id="padBackStep">
            <button class="stp" type="button" data-step="-0.5" aria-label="减少后置补时">−</button>
            <span class="stp-val" id="padBackVal">2.0s</span>
            <button class="stp" type="button" data-step="0.5" aria-label="增加后置补时">+</button>
          </div>
          <span class="step-unit">秒</span>
        </div>

        <div class="set-row">
          <span class="lab">自动跟焦</span>
          <button class="sw" id="autoSw" role="switch"></button>
        </div>
        <div class="set-row">
          <span class="lab">缩放倍率</span>
          <div class="chips" id="zoomChips">
            <button class="chip" data-zoom="1">1.00×</button>
            <button class="chip" data-zoom="1.15">1.15×</button>
            <button class="chip" data-zoom="1.25">1.25×</button>
            <button class="chip" data-zoom="1.4">1.40×</button>
            <button class="chip" data-zoom="1.6">1.60×</button>
            <button class="chip" data-zoom="2">2.00×</button>
          </div>
        </div>
        <div class="set-row">
          <span class="lab">竖屏分屏</span>
          <button class="sw" id="splitSw" role="switch"></button>
        </div>
        <div class="set-row">
          <span class="lab">焦点框</span>
          <button class="sw" id="focusSw" role="switch"></button>
        </div>
        <div class="set-row">
          <span class="lab">算法可视化</span>
          <button class="sw" id="algoSw" role="switch"></button>
        </div>
        <!-- 视频缓存：本地磁盘缓存 B 站视频/音频字节，关掉 App 再打开同一场直接命中 -->
        <div class="set-row">
          <span class="lab">缓存上限</span>
          <div class="chips" id="cacheChips">
            <button class="chip" data-mb="200" type="button">200M</button>
            <button class="chip" data-mb="600" type="button">600M</button>
            <button class="chip" data-mb="1024" type="button">1G</button>
            <button class="chip" data-mb="2048" type="button">2G</button>
          </div>
        </div>
        <div class="set-row">
          <span class="lab">缓存占用</span>
          <span class="cache-stat" id="cacheStat">读取中…</span>
          <button class="chip" id="cacheClear" type="button">清空</button>
        </div>
        <div class="set-row">
          <span class="lab">登录 Cookie</span>
          <input id="cookieInput" class="ck-input" type="text" placeholder="SESSDATA=…（可选）" spellcheck="false">
          <button class="chip" id="cookieSave" type="button">保存</button>
        </div>
        <div class="set-row">
          <span class="lab">软件更新</span>
          <span class="val upd-ver" id="curVer">—</span>
          <button class="chip" id="btnCheckUpdate" type="button">检查更新</button>
        </div>
        <div class="upd-box" id="updBox">
          <div class="upd-status" id="updateStatus">从 GitHub Releases 检查并下载新版本</div>
          <div class="upd-notes" id="updateNotes" hidden></div>
          <progress class="upd-prog" id="updateProgress" max="100" value="0" hidden></progress>
          <div class="upd-actions" id="updateActions" hidden>
            <button class="chip on" id="btnDoUpdate" type="button">下载并安装</button>
          </div>
        </div>
        
        <div class="sheet-foot">
          <button class="set-back" id="setBack" type="button">▶ 回到播放</button>
          <span>播放页右上角「列表 / 设置」可进入本页<br>VCNC 足球沉浸场</span>
        </div>
      </div>
    </section>

  </div>

  <!-- 播放页右上角两个浮动半透明入口（不做顶部 tab，省空间） -->
  <div class="page-nav" id="pageNav">
    <button class="ptab" data-page="0" type="button">列表</button>
    <button class="ptab on" data-page="1" type="button">播放</button>
    <button class="ptab" data-page="2" type="button">设置</button>
  </div>

  <!-- 轻提示：三页共用 -->
  <div id="toast"></div>

  <!-- 分享兜底：系统没透传 B 站链接时（外屏分享等场景） -->
  <div class="fallback" id="fallback" hidden>
    <div class="fb-card">
      <div class="fb-title">没能从分享里读到 B 站链接</div>
      <div class="fb-sub" id="fbRaw"></div>
      <div class="fb-row">
        <input id="fbInput" type="text" placeholder="粘贴 BV 号 / b23.tv 短链 / bilibili 链接" spellcheck="false">
        <button class="fb-go" id="fbGo">解析</button>
      </div>
      <button class="fb-close" id="fbClose">关闭</button>
    </div>
  </div>

  <!-- 全局加载失败（feed 拉取失败时） -->
  <div id="fatal" hidden>
    <div class="fb-card">
      <div class="fb-title">加载失败</div>
      <div class="fb-sub" id="fatalMsg"></div>
      <div class="fb-row">
        <button class="fb-go" id="fatalRetry" type="button">重试</button>
      </div>
    </div>
  </div>
</div>

<script src="feed.js"></script>
</body>
</html>
